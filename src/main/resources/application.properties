spring.application.name=monitor-service
spring.config.import=optional:file:.env[.properties]

# Database connection settings
app.datasource.url=jdbc:sqlserver://${MONITORED_ENDPOINT_DB_HOST:localhost}:${MONITORED_ENDPOINT_DB_PORT:1433};databaseName=${MONITORED_ENDPOINT_DB_NAME:ApiWatchMonitor};encrypt=true;trustServerCertificate=true;
app.datasource.username=${MONITORED_ENDPOINT_DB_USERNAME}
app.datasource.password=${MONITORED_ENDPOINT_DB_PASSWORD}
app.datasource.driverclassname=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate behavioral settings
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update
hibernate.dialect=org.hibernate.dialect.SQLServerDialect
