spring.application.name=analytics-service
spring.config.import=optional:file:.env[.properties]

# SQL Server
spring.datasource.url=jdbc:sqlserver://${ANALYTICS_DB_HOST:localhost}:${ANALYTICS_DB_PORT:1433};databaseName=${ANALYTICS_DB_NAME:ApiWatchAnalytics};encrypt=true;trustServerCertificate=true
spring.datasource.username=${ANALYTICS_DB_USERNAME}
spring.datasource.password=${ANALYTICS_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}